<!--
  全管理画面共通ローダー（admin-main インジェクトポイントに常時注入）。
  ページ内に <acms-ai-assistant-button> またはメディアAIのマーカーがある場合だけ、
  本体バンドル(acms-ai.js)を遅延ロードする。
  プロバイダ未設定(authorized=false)のときは ServiceProvider 側で注入自体を行わない。
  エントリー編集で admin-entry-field 側が既にバンドルを読み込む場合は、二重ロードを避ける。

  ※ BEGIN_MODULE でラップすると Template::render() が走り、JS 内の「同一行で開閉する
     中身ありの波括弧 {...}」を変数とみなして削除してしまう（loadBundle の {once:true}
     等が消えて構文崩壊する）。そのためモジュール化せず素の <script> として注入し、
     authorized 判定は PHP（ServiceProvider）側で行う。%{AI_JS}/%{AI_CSS} はグローバル
     変数置換のため module 不要で解決される。
-->
<script>
(function () {
  const JS_URL = '%{AI_JS}';
  const CSS_URL = '%{AI_CSS}';
  const BUNDLE_TRIGGER_SELECTOR = 'acms-ai-assistant-button, #js-acms-ai-media';

  function bundleAlreadyPresent() {
    // 既に読み込み済み or 読み込み予約済みなら true
    if (window.customElements && window.customElements.get('acms-ai-assistant-button')) {
      return true;
    }
    return !!document.querySelector(
      'script[data-acms-ai-bundle], script[src*="extension/plugins/AI/bundle/acms-ai.js"]'
    );
  }

  function nodeContainsBundleTrigger(node) {
    if (node.nodeType !== 1) {
      return false;
    }
    return node.matches(BUNDLE_TRIGGER_SELECTOR) || !!node.querySelector(BUNDLE_TRIGGER_SELECTOR);
  }

  function recordsContainBundleTrigger(records) {
    return records.some(function (record) {
      return Array.from(record.addedNodes).some(nodeContainsBundleTrigger);
    });
  }

  function loadBundle(triggerPresent) {
    if (bundleAlreadyPresent()) {
      return true; // 二重ロード防止（エントリー編集など）
    }
    if (!triggerPresent) {
      return false; // 現時点では未検出。遅延挿入を監視する
    }
    if (CSS_URL) {
      const stylesheetAlreadyPresent = document.querySelector(
        'link[data-acms-ai-bundle-style], link[href*="extension/plugins/AI/bundle/acms-ai.css"]'
      );
      if (!stylesheetAlreadyPresent) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = CSS_URL;
        link.setAttribute('data-acms-ai-bundle-style', '');
        document.head.appendChild(link);
      }
    }
    const script = document.createElement('script');
    script.src = JS_URL;
    script.crossOrigin = 'anonymous';
    script.setAttribute('data-acms-ai-bundle', '');
    document.body.appendChild(script);
    return true;
  }

  function startLoader() {
    const observationRoot = document.getElementById('acms-admin-main')
      || document.body
      || document.documentElement;
    if (!observationRoot || loadBundle(nodeContainsBundleTrigger(observationRoot))) {
      return;
    }

    // Ajax・モーダル等で後から追加されるボタンも検出する。
    // バンドルの読み込み予約ができた時点で監視を終了する。
    if (!window.MutationObserver) {
      return;
    }
    const observer = new MutationObserver(function (records) {
      if (recordsContainBundleTrigger(records) && loadBundle(true)) {
        observer.disconnect();
      }
    });
    observer.observe(observationRoot, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startLoader, { once: true });
  } else {
    startLoader();
  }
})();
</script>
