#BEGIN_AIConfig
# acms-ai プラグインの既定設定。インストール時に private/config.system.yaml へ追記される。
# #BEGIN_AIConfig 〜 #END_AIConfig で囲み、再インストール時の二重記述を防いでいるので削除しないこと。
# ここに既定プロンプトを置くことで、管理画面の textarea に既定値が表示され（BEGIN_IF 不要）、
# 未保存でも生成時に既定プロンプトが使われる。

# エントリー: タイトル/タグ生成は既定で有効（チェックを外すと機能ごと非表示・無効になる）
ai_title_enabled: "on"
ai_tag_enabled: "on"

# エントリー: タイトル/タグ生成の既定プロンプト
ai_title_prompt: |-
  - Please give 5 suggestions.
  - Please answer in Japanese.
ai_tag_prompt: "Please answer in Japanese."

# さくらのAI Engine（OpenAI互換）の既定エンドポイント
ai_compat_base_url: "https://api.ai.sakura.ad.jp/v1"

# 管理画面に表示するモデル候補の絞り込み
# 空白・カンマ・改行区切りで複数指定でき、* をワイルドカードとして使用できる（空 = 全モデル）
ai_openai_allowed_models: "gpt-5.6* gpt-5.5* gpt-5.4*"
ai_anthropic_allowed_models: ""
ai_gemini_allowed_models: ""
#END_AIConfig
